# Verifica, testa e publica no GitHub Pages a cada push na main.
# Pré-requisito (uma vez): Settings → Pages → Source = "GitHub Actions".
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar (dados, tipos, lint, unitários)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Nenhum dado real do cliente no repositório
        run: |
          proibidos=$(git ls-files | grep -Ei '^dados/|\.(xls|xlsx|xlsm|ods|csv)$' | grep -v '^tests/fixtures/' || true)
          if [ -n "$proibidos" ]; then
            echo "::error::Arquivos de dados versionados (proibido):"
            echo "$proibidos"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  e2e:
    name: E2E offline (Chromium 360 px)
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [verificar, e2e]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build com o caminho do repositório
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
